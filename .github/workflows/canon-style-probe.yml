name: Canon style probe
on:
  push:
    branches: [claude/canon-style-probe]
    paths: [probe/probe.js, .github/workflows/canon-style-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: mkdir -p probe/shots && node probe/probe.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/canon-style.json probe/shots
          git commit -m "Probe results"
          git push
