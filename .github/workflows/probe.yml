name: camera-probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python probe.py
      - run: |
          git config user.name bot; git config user.email bot@x
          git add out; git commit -m out; git push
